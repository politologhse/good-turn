name: Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  # === CLI builds (existing) ===
  build-cli:
    name: CLI ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: '7'
          - goos: linux
            goarch: mipsle
            gomips: softfloat
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: android
            goarch: arm64
            cgo: 1
            api: 21
          - goos: android
            goarch: arm
            cgo: 1
            api: 21

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'

      - name: Setup Android NDK
        if: matrix.goos == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          ANDROID_API: ${{ matrix.api }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          if [ "$GOOS" = "android" ]; then
            TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            if [ "$GOARCH" = "arm64" ]; then
              export CC="$TOOLCHAIN_BIN/aarch64-linux-android${ANDROID_API}-clang"
            elif [ "$GOARCH" = "arm" ]; then
              export CC="$TOOLCHAIN_BIN/armv7a-linux-androideabi${ANDROID_API}-clang"
            fi
          fi

          mkdir -p dist
          EXT=""; [ "$GOOS" = "windows" ] && EXT=.exe

          go build -ldflags "-s -w -checklinkname=0" -trimpath \
            -o "dist/client-${GOOS}-${GOARCH}${EXT}" ./client

          go build -ldflags "-s -w -checklinkname=0" -trimpath \
            -o "dist/server-${GOOS}-${GOARCH}${EXT}" ./server

      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/**

  # === GUI builds (macOS + Windows with bundled Hysteria2) ===
  build-gui-macos:
    name: GUI macOS/${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Download Hysteria2
        run: |
          HY_VERSION="$(tr -d '[:space:]' < .hysteria-version)"
          curl -fSL -o /tmp/hysteria \
            "https://github.com/apernet/hysteria/releases/download/${HY_VERSION}/hysteria-darwin-${{ matrix.arch }}"
          chmod +x /tmp/hysteria

      - name: Build GUI
        working-directory: gui
        run: |
          wails build -platform "darwin/${{ matrix.arch }}" -clean

      - name: Bundle Hysteria2 into .app
        working-directory: gui
        run: |
          cp /tmp/hysteria "build/bin/good-turn.app/Contents/MacOS/hysteria"
          chmod +x "build/bin/good-turn.app/Contents/MacOS/hysteria"

      - name: Create ZIP
        working-directory: gui/build/bin
        run: |
          ditto -c -k --keepParent good-turn.app "Good-TURN-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: gui-macos-${{ matrix.arch }}
          path: gui/build/bin/Good-TURN-macos-*.zip

  build-gui-windows:
    name: GUI Windows/amd64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Download Hysteria2
        shell: pwsh
        run: |
          $hyVersion = (Get-Content .hysteria-version -Raw).Trim()
          Invoke-WebRequest -Uri "https://github.com/apernet/hysteria/releases/download/$hyVersion/hysteria-windows-amd64.exe" -OutFile "$env:TEMP\hysteria.exe"

      - name: Build GUI
        working-directory: gui
        run: wails build -platform "windows/amd64" -clean

      - name: Bundle Hysteria2
        shell: pwsh
        run: |
          Copy-Item "$env:TEMP\hysteria.exe" "gui\build\bin\hysteria.exe"

      - name: Create ZIP
        shell: pwsh
        working-directory: gui\build\bin
        run: |
          Compress-Archive -Path good-turn.exe, hysteria.exe -DestinationPath "Good-TURN-windows-amd64.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: gui-windows-amd64
          path: gui/build/bin/Good-TURN-windows-*.zip

  # === Release ===
  release:
    name: Create GitHub Release
    needs: [build-cli, build-gui-macos, build-gui-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          find . -type f \( -name '*.exe' -o -name 'client-*' -o -name 'server-*' -o -name '*.zip' \) -exec sha256sum {} \; | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
            dist/SHA256SUMS
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
