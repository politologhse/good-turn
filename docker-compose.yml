version: "3.8"

services:
  hysteria:
    image: tobyxdd/hysteria:v2
    restart: unless-stopped
    volumes:
      - ./hysteria-config.yaml:/etc/hysteria/config.yaml:ro
      - hysteria-certs:/etc/hysteria/certs
    network_mode: host
    command: server -c /etc/hysteria/config.yaml

  good-turn:
    build: .
    restart: unless-stopped
    environment:
      CONNECT_ADDR: "127.0.0.1:443"
      HEALTH_ADDR: "127.0.0.1:56001"
    depends_on:
      - hysteria
    network_mode: host
    healthcheck:
      test: ["CMD", "/app/good-turn-server", "-health-probe", "127.0.0.1:56001"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hysteria-certs:
